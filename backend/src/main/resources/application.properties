spring.application.name=Competition
server.port=8080

# ========== 数据库（本地开发先用 localhost；部署到公网后改为云 MySQL 地址） ==========
spring.datasource.url=jdbc:mysql://localhost:3306/competition
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========== 算法服务地址（队友 Python 推理接口，部署时改为实际 URL） ==========
algorithm.service.url=https://retrolental-georgette-municipally.ngrok-free.dev/predict

# ========== 上传文件保存路径（可改为服务器上的绝对路径或后续接入 OSS） ==========
upload.path=D:/A31/uploads

# ========== MyBatis ==========
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.use-generated-keys=true
