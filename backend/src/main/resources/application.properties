spring.application.name=mandrill-recognition
server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}

# ========== 数据库配置（通过环境变量注入，切勿在代码库中提交真实密码） ==========
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mandrill}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========== 算法服务地址（Python 推理接口，部署时通过环境变量设置） ==========
algorithm.service.url=${ALGORITHM_SERVICE_URL:http://localhost:8000/predict}

# ========== 上传文件保存路径 ==========
upload.path=${UPLOAD_PATH:./uploads}

# ========== 文件上传大小限制 ==========
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=200MB

# ========== MyBatis ==========
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.use-generated-keys=true

# ========== Jackson ==========
spring.jackson.time-zone=Asia/Shanghai

# ========== Demo / Mock mode（生产环境请设为 false） ==========
algorithm.mock.enabled=${ALGORITHM_MOCK_ENABLED:false}

# ========== CORS 允许的源（逗号分隔，生产环境务必限制为实际域名） ==========
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
