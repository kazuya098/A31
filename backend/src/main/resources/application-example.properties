# 后端配置示例文件
# 复制此文件为 application.properties 并填入实际值，或通过环境变量注入

# 服务端口
SERVER_PORT=8080
SERVER_ADDRESS=0.0.0.0

# 数据库配置
DB_HOST=localhost
DB_PORT=3306
DB_NAME=mandrill
DB_USERNAME=root
DB_PASSWORD=your_secure_password

# 算法服务地址（Python ML 推理服务）
ALGORITHM_SERVICE_URL=http://localhost:8000/predict

# 上传文件保存路径
UPLOAD_PATH=./uploads

# 是否启用 Mock 算法（开发演示用，生产设为 false）
ALGORITHM_MOCK_ENABLED=false

# CORS 允许的源（逗号分隔）
CORS_ALLOWED_ORIGINS=http://localhost:5173
